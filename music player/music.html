<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player with Playlists</title>
    <link rel="stylesheet" href="music.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
<div class="player-container">
    
    <!-- LEFT PANEL: Navigation & Playlists -->
    <div class="sidebar">
    <div class="sidebar-header">
        <div class="brand">
            <i class="fa-solid fa-music brand-icon"></i>
            <span>My Music</span>
        </div>
        <div class="header-actions">
            <button id="add-playlist-btn" title="Create Playlist"><i class="fa-solid fa-folder-plus"></i></button>
            <button id="add-song-btn" title="Add New Song"><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

<!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="all"><i class="fa-solid fa-music"></i> All Songs</button>
        <button class="tab-btn" data-tab="favourite"><i class="fa-regular fa-heart"></i> Favourite</button>
        <button class="tab-btn" data-tab="recent"><i class="fa-regular fa-clock"></i> Recent</button>
    </div>

    <!-- Playlists Section -->
        <div class="playlist-section">
        <span class="section-title">Playlists</span>
        <div class="playlist-chips" id="playlist-chips">
        <!-- Dynamic Playlist Badges -->
        </div>
    </div>

<!-- Track List -->
        <div class="song-list" id="song-list">
        <!-- Dynamic playlist items -->
        </div>
    </div>

    <!-- RIGHT PANEL: Now Playing View -->
    <div class="main-player">
    <div class="cover-art-container">
        <img id="current-cover" src="resorce/Your-Power-Billie-Eilish.jpg" alt="Cover Art" />
    </div>

    <div class="song-details">
        <div>
            <h2 id="current-title">Your-Power</h2>
            <p id="current-artist">Billie-Eilish</p>
        </div>
        <button id="main-heart-btn" class="main-heart-btn"><i class="fa-regular fa-heart"></i></button>
    </div>

<!-- Progress Bar -->
    <div class="progress-section">
        <input type="range" id="progress-bar" value="0" min="0" step="0.1" />
        <div class="time-stamps">
            <span id="current-time">0:00</span>
            <span id="duration-time">0:00</span>
        </div>
    </div>

<!-- Player Controls -->
    <div class="player-controls">
        <button id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
        <button id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
        <button id="play-pause-btn" class="play-btn"><i class="fa-solid fa-play"></i></button>
        <button id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
        <button id="repeat-btn"><i class="fa-solid fa-repeat"></i></button>
    </div>

    <!-- Volume Bar -->
        <div class="volume-container">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volume-bar" value="0.5" min="0" max="1" step="0.05" />
            <i class="fa-solid fa-volume-low"></i>
        </div>
    </div>
</div>

<!-- ADD NEW SONG MODAL -->
<div class="modal" id="add-modal">
    <div class="modal-content">
        <span class="close-modal" id="close-modal">&times;</span>
        <h3>Add New Song</h3>
        <form id="add-song-form">
        <div class="form-group">
            <label>Song Title</label>
            <input type="text" id="song-title-input" required placeholder="Enter track title" />
        </div>
        <div class="form-group">
            <label>Artist Name</label>
            <input type="text" id="song-artist-input" required placeholder="Enter artist name" />
        </div>
        <div class="form-group">
            <label>Assign to Playlist</label>
            <select id="song-playlist-select">
                <option value="">None (All Songs Only)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Audio File</label>
            <input type="file" id="song-file-input" accept="audio/*" required />
        </div>
        <div class="form-group">
            <label>Cover Image (Optional)</label>
            <input type="file" id="song-cover-input" accept="image/*" />
        </div>
        <button type="submit" class="submit-btn">Add to Library</button>
        </form>
    </div>
</div>

<!-- CREATE PLAYLIST MODAL -->
<div class="modal" id="playlist-modal">
    <div class="modal-content">
        <span class="close-modal" id="close-playlist-modal">&times;</span>
        <h3>Create New Playlist</h3>
        <form id="create-playlist-form">
        <div class="form-group">
            <label>Playlist Name</label>
            <input type="text" id="playlist-name-input" required placeholder="e.g. Chill Beats, Workout, Rock" />
        </div>
        <button type="submit" class="submit-btn">Create Playlist</button>
        </form>
    </div>
</div>

    <audio id="audio-element"></audio>
    <script src="music.js"></script>
</body>
</html>
